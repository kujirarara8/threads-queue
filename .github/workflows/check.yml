name: 予約リストを確かめる

on:
  push:
    paths: ["queue/**", "images/**", "scripts/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/publish.py --check
